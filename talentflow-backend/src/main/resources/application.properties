# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/USERpart
spring.data.mongodb.auto-index-creation=true

# MongoDB connection pool tuning — reduces connection overhead
spring.data.mongodb.connection-pool.max-size=50
spring.data.mongodb.connection-pool.min-size=1
spring.data.mongodb.connection-pool.max-wait-time=2000
spring.data.mongodb.connection-pool.max-connection-life-time=60000
spring.data.mongodb.connection-pool.max-connection-idle-time=30000

# Server Configuration
server.port=8080

# Tomcat thread pool — handle more concurrent requests
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=5
server.tomcat.accept-count=100
server.tomcat.connection-timeout=5000

# ── Startup speed optimisations ──────────────────────────────────
# Skip banner to shave ~100ms
spring.main.banner-mode=off
# Don't validate beans eagerly — lazy init already set in main()
spring.main.lazy-initialization=true
# Disable unused auto-configurations for faster context load
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.admin.SpringApplicationAdminJmxAutoConfiguration,\
  org.springframework.boot.autoconfigure.jmx.JmxAutoConfiguration# Compression — reduces payload size over the wire
server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/css,text/html
server.compression.min-response-size=1024

# JWT Configuration
spring.security.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
spring.security.jwt.expiration=900000

# TOTP Issuer Name (shown in authenticator app)
totp.issuer=TalentFlowAI

# Admin Registration Secret Code
admin.registration.code=123456789

# Mail Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
