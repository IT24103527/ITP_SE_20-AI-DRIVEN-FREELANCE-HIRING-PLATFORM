# Async thread pool — email and other @Async tasks run on a dedicated pool
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-

# Logging
logging.level.com.example.talentflowbackend=INFO
logging.level.org.springframework.data.mongodb=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.mail=DEBUG

# Rate limiting (disabled in tests via application.properties)
app.rate-limit.enabled=true

# ── Security hardening ────────────────────────────────────────────
# Hide Spring Boot version from error responses
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Disable default /actuator exposure (prevent info leakage)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

